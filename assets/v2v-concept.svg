    <circle cx="254" cy="195" r="11" fill="#fce6b0"/>
    <text x="24" y="368" fill="#d4e0fa" font-family="Arial, sans-serif" font-size="17" font-weight="700">QUALITY REVIEW</text>
  </g>
  <path d="M389 449h43m-13-13 13 13-13 13M764 449h43m-13-13 13 13-13 13" fill="none" stroke="#3155c6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M72 703H1128" stroke="#7484a8"/>
  <text x="72" y="752" fill="#29395d" font-family="Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="3">TASK DESIGN</text>
  <text x="479" y="752" fill="#29395d" font-family="Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="3">DATA QUALITY</text>
