<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual video-to-video data workflow</title>
  <desc id="desc">Three abstract video frames move through task specification, sample construction, and quality review. This illustration contains no research data.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#aab8d7" stroke-opacity=".38" stroke-width="1"/></pattern>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dfe9f7"/><stop offset="1" stop-color="#b7c5f2"/></linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#242f59"/><stop offset="1" stop-color="#151e3e"/></linearGradient>
  </defs>
  <rect width="1200" height="860" fill="url(#back)"/>
  <rect width="1200" height="860" fill="url(#grid)"/>
  <circle cx="1082" cy="82" r="126" fill="#d9f06f" opacity=".88"/>
  <text x="70" y="202" fill="#243251" font-family="Arial, sans-serif" font-size="105" font-weight="800" letter-spacing="-8">V2V</text>
  <text x="345" y="194" fill="#394767" font-family="Arial, sans-serif" font-size="25" font-weight="600">from a task idea to reviewable examples</text>
  <g transform="translate(72 248)">
    <rect width="306" height="397" rx="15" fill="url(#frame)"/>
    <text x="24" y="39" fill="#b5c4ee" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3">FRAME 01</text>
    <path d="M24 68H282M24 334H282" stroke="#6b7ba4" opacity=".6"/>
    <path d="M70 95V310M140 95V310M210 95V310M24 150H282M24 230H282" stroke="#90a4ce" opacity=".2"/>
    <rect x="64" y="148" width="98" height="98" rx="13" fill="#7299f8" opacity=".9"/>
    <circle cx="180" cy="206" r="47" fill="#ecab96"/>
    <circle cx="195" cy="195" r="11" fill="#fce6b0"/>
    <text x="24" y="368" fill="#d4e0fa" font-family="Arial, sans-serif" font-size="17" font-weight="700">TASK SPEC</text>
  </g>
  <g transform="translate(447 248)">
    <rect width="306" height="397" rx="15" fill="url(#frame)"/>
    <text x="24" y="39" fill="#b5c4ee" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3">FRAME 02</text>
    <path d="M24 68H282M24 334H282" stroke="#6b7ba4" opacity=".6"/>
    <path d="M70 95V310M140 95V310M210 95V310M24 150H282M24 230H282" stroke="#90a4ce" opacity=".2"/>
    <rect x="96" y="148" width="98" height="98" rx="13" fill="#7299f8" opacity=".9"/>
    <circle cx="211" cy="206" r="47" fill="#ecab96"/>
    <circle cx="226" cy="195" r="11" fill="#fce6b0"/>
    <text x="24" y="368" fill="#d4e0fa" font-family="Arial, sans-serif" font-size="17" font-weight="700">SAMPLE</text>
  </g>
  <g transform="translate(822 248)">
    <rect width="306" height="397" rx="15" fill="url(#frame)"/>
    <text x="24" y="39" fill="#b5c4ee" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3">FRAME 03</text>
    <path d="M24 68H282M24 334H282" stroke="#6b7ba4" opacity=".6"/>
    <path d="M70 95V310M140 95V310M210 95V310M24 150H282M24 230H282" stroke="#90a4ce" opacity=".2"/>
